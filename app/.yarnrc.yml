  "@testing-library/dom": ^10.4.0
  "@types/lodash": ^4.14.182
  "@types/mime": ^2.0.3
  "@types/styled-components": ^5.1.23
  "@vitejs/plugin-react": ^6.0.4
  "@vitest/coverage-v8": ^4.1.10
