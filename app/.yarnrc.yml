compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

# Peers these packages can genuinely run without: monaco-editor is lazy-loaded
# from a CDN by @monaco-editor/loader, and the rollup peer is unused when the
# plugin runs inside vite (rolldown) instead of rollup itself.
packageExtensions:
  "@monaco-editor/loader@*":
    peerDependenciesMeta:
      monaco-editor:
        optional: true
  "@monaco-editor/react@*":
    peerDependenciesMeta:
      monaco-editor:
        optional: true
  "@rollup/plugin-inject@^4.0.0":
    peerDependenciesMeta:
      rollup:
        optional: true
  "@rollup/pluginutils@^3.0.0":
    peerDependenciesMeta:
      rollup:
        optional: true
  "rollup-plugin-polyfill-node@*":
    peerDependenciesMeta:
      rollup:
        optional: true

