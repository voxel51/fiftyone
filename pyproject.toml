[build-system]
# setuptools >=77 accepts the SPDX license expression below;
# wheel is a dynamic build requirement the backend adds itself
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fiftyone"
description = "FiftyOne: the open-source tool for building high-quality datasets and computer vision models"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Voxel51, Inc.", email = "info@voxel51.com" }]
requires-python = ">=3.10"
# Version stays in setup.py: releases override it via the RELEASE_VERSION
# environment variable (with a prefix check), which static metadata cannot
# express, and CI greps setup.py's VERSION line
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # python-packaged or meta libraries (unconstrained)
    "Deprecated", # Don't constrain python-packaged `Deprecated`
    "packaging", # Don't constrain python-packaged `packaging`
    "setuptools", # Don't constrain python-packaged `setuptools`
    # third-party packages (constrained at lower and upper majors)
    "aiofiles>=20,<26",
    "argcomplete>=2,<4",
    "async_lru>=2,<3",
    "beautifulsoup4>=2,<5", # BS4 will only have 4.x versions
    "boto3>=1,<2",
    "cachetools>=5,<8",
    "dacite>=1.6.0,<2",
    "dill>=0.1,<0.5",
    "exceptiongroup>=1,<2",
    "ftfy>=4,<7",
    "humanize>=2,<5",
    "hypercorn>=0.13.2,<0.19",
    "Jinja2>=3,<4",
    "jsonpatch>=1,<2",
    "mongoengine~=0.29.1", # Keep small bounds on mongo-related libraries
    "Pillow>=12.2",
    "plotly>=6.1.1,<7",
    "pprintpp>=0.1,<0.5",
    "psutil>=5,<8",
    "pydash>=6,<9",
    "pymongo~=4.15.2", # Keep small bounds on mongo-related libraries
    "pytz", # Doesn't follow semver, keep unconstrained
    "PyYAML>=4,<7",
    "regex", # Doesn't follow semver, keep unconstrained
    "retrying>=1,<2",
    "sseclient-py>=1.7.2,<2",
    "sse-starlette>=0.10.3,<4",
    "starlette>=1.3.1,<1.4",
    "strawberry-graphql>=0.315.7,<0.317.0",
    "tabulate>=0.7,<0.11",
    "tqdm>=2,<5",
    "xmltodict>=1,<2",
    "universal-analytics-python3>=1.0.1,<2",
    # ML Libraries
    "matplotlib<4",
    "numpy<3",
    "opencv-python-headless<5",
    "pandas<4",
    "pypcd4>=1.4,<2",
    "rtree<2",
    "scikit-learn<2",
    "scikit-image<1",
    "scipy<2",
    # internal packages
    "fiftyone-brain>=0.24.0,<0.25",
    "fiftyone-db>=0.4,<2.0",
    "voxel51-eta>=0.17,<0.18",
]

[project.optional-dependencies]
multimodal-mcap = ["protobuf==6.33.6"]
multimodal = ["fiftyone[multimodal-mcap]"]

[project.scripts]
fiftyone = "fiftyone.core.cli:main"

[project.urls]
Homepage = "https://github.com/voxel51/fiftyone"

[tool.setuptools.packages.find]
# Exact names, as the removed setup.py had them — globs would also
# exclude packages that merely share a prefix
exclude = ["app", "eta", "package", "requirements", "tests", "tools"]

[tool.setuptools]
include-package-data = true

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
  | \.git
)/
'''

[tool.isort]
profile = "black"
line_length = 79
known_first_party = ["eta", "brain"]
force_sort_within_sections = true
