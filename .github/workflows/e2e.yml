name: Test e2e

on:
  workflow_call:
jobs:
  prepare-e2e:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Prepare e2e assets
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Setup node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Prepare yarn 4
        run: corepack prepare yarn@4.9.1 --activate

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false

      - name: Compute app tree hash
        id: app-tree-hash
        run: echo "hash=$(git rev-parse HEAD:app)" >> $GITHUB_OUTPUT

      - name: Cache built app static assets
        id: app-static-cache
        uses: actions/cache@v5
        with:
          path: fiftyone/server/static
          key: app-static-${{ runner.os }}-${{ steps.app-tree-hash.outputs.hash }}

      - name: Cache Node Modules
        id: app-node-cache
        uses: actions/cache@v5
        with:
          path: |
            app/node_modules
            app/.yarn/cache
          key: node-modules-${{ hashFiles('app/yarn.lock') }}

      - name: Install app
        if: steps.app-static-cache.outputs.cache-hit != 'true'
        run: yarn install
        working-directory: app

      - name: Build app
        if: steps.app-static-cache.outputs.cache-hit != 'true'
        run: make app

      - name: Bundle built app static assets
        run: tar -czf e2e-app-static.tgz fiftyone/server/static

      - name: Upload built app static assets
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-static
          path: e2e-app-static.tgz
          retention-days: 1

      - name: Cache E2E Node Modules
        id: e2e-node-cache
        uses: actions/cache@v5
        with:
          path: |
            e2e-pw/node_modules
          key: node-modules-${{ hashFiles('e2e-pw/yarn.lock') }}

      - name: Install E2E dependencies
        run: yarn install
        working-directory: e2e-pw

  test-e2e:
    needs: prepare-e2e
    timeout-minutes: 90
    runs-on: ubuntu-latest
    # The prebaked image (built by build-ci-images.yml) carries Python +
    # fiftyone's dependency tree, Node/Yarn, ffmpeg, and Chromium, so shard
    # jobs skip all toolchain setup.
    container:
      image: ghcr.io/voxel51/fiftyone-e2e:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    name: Run e2e shard ${{ matrix.shard }}/4 (report-only, Mongo ${{ matrix.mongodb-version }})
    env:
      FIFTYONE_DO_NOT_TRACK: true
      FIFTYONE_APP_DEFAULT_QUERY_PERFORMANCE: false
      # Job containers reach service containers by service name, not localhost
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DATABASE_NAME: playwright
      ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FIFTYONE_PLUGINS_DIR: ${{ github.workspace }}/e2e-pw/src/shared/assets/plugins
      VFF_EXP_ANNOTATION: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        mongodb-version:
          - "latest"
        shard: [1, 2, 3, 4]
    services:
      # Run MongoDB as a service container rather than via a Docker-based
      # action. Container actions are built from `docker:latest` at job start
      # (before any step runs), so the previous `supercharge/mongodb-github-action`
      # added an extra, unauthenticated Docker Hub pull that intermittently timed
      # out. The runner's docker daemon pulls `mongo` directly here, with native
      # health checks and retries.
      mongo:
        image: mongo:${{ matrix.mongodb-version }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Download built app static assets
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-static

      - name: Restore built app static assets
        run: tar -xzf e2e-app-static.tgz -C .

      - name: Install fiftyone
        # dependencies are baked into the image; this only builds fiftyone
        # itself from the PR's source (plus any deps added since the last
        # image build)
        run: |
          uv pip install --system '.[multimodal]' -r requirements/e2e.txt

      - name: Configure
        id: test_config
        run: |
          python tests/utils/setup_config.py
          python tests/utils/github_actions_flags.py

      - name: Cache E2E Node Modules
        id: e2e-node-cache
        uses: actions/cache@v5
        with:
          path: |
            e2e-pw/node_modules
          key: node-modules-${{ hashFiles('e2e-pw/yarn.lock') }}

      - name: Install E2E dependencies
        run: yarn install
        working-directory: e2e-pw

      - name: Run Playwright tests
        # Report-only: failed specs are surfaced by the e2e verdict job from
        # the merged blob reports. A red shard means infra death (timeout,
        # lost runner), not a test failure.
        run: |
          yarn e2e --shard=${{ matrix.shard }}/4 ||
            echo "::warning::shard ${{ matrix.shard }} had failing specs; see the e2e verdict job"
        working-directory: e2e-pw

      - name: Lint Playwright tests
        run: yarn lint
        working-directory: e2e-pw

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-blob-shard-${{ matrix.shard }}
          path: e2e-pw/blob-report/
          # 3 days so reports from Friday/weekend runs survive into Monday.
          retention-days: 3

  e2e-verdict:
    needs: test-e2e
    # The single authoritative e2e check: shard jobs are report-only, so
    # this job alone decides pass/fail from the merged shard reports.
    if: always() && contains(fromJSON('["success", "failure"]'), needs.test-e2e.result)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/voxel51/fiftyone-e2e:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    name: e2e verdict
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /e2e-pw/**
          sparse-checkout-cone-mode: false

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-shard-*
          path: e2e-pw/all-blob-reports
          merge-multiple: true

      - name: Cache E2E Node Modules
        id: e2e-node-cache
        uses: actions/cache@v5
        with:
          path: |
            e2e-pw/node_modules
          key: node-modules-${{ hashFiles('e2e-pw/yarn.lock') }}

      - name: Install E2E dependencies
        run: yarn install
        working-directory: e2e-pw

      - name: Merge shard reports
        working-directory: e2e-pw
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-results.json
        run: yarn playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-merged
          path: e2e-pw/playwright-report/
          # 3 days so reports from Friday/weekend runs survive into Monday.
          retention-days: 3

      - name: Summarize
        working-directory: e2e-pw
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/report-summary.mjs merged-results.json > e2e-summary.md
          cat e2e-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post authoritative PR comment
        # Same-repo PRs only: fork tokens are read-only, and the job summary
        # above still carries the itemized list there.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('e2e-pw/e2e-summary.md', 'utf8');
            const marker = '<!-- e2e-authoritative-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce verdict
        working-directory: e2e-pw
        env:
          EXPECTED_SHARDS: "4"
        run: node scripts/enforce-verdict.mjs merged-results.json all-blob-reports
