name: Test e2e

on:
  workflow_call:
jobs:
  prepare-e2e:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Prepare e2e assets
    outputs:
      burn-in-count: ${{ steps.burn-in-specs.outputs.count }}
      burn-in-specs: ${{ steps.burn-in-specs.outputs.specs }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Mark the CI comment in progress
        # keeps the authoritative comment honest while a newer run is
        # executing; the verdict job's rewrite clears the banner (or the
        # e2e-aborted job flips it when the pipeline dies before the verdict)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const flavor = process.env.GITHUB_REPOSITORY.endsWith(
              'fiftyone-teams',
            )
              ? 'FOE'
              : 'OSS';
            const marker = `<!-- ci-report:${flavor} -->`;
            const sha = context.payload.pull_request.head.sha.slice(0, 10);
            const runUrl = `${context.serverUrl}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              const banner = `> ⏳ CI running for \`${sha}\` — [run](${runUrl}). Results below are from an earlier run.`;
              const lines = existing.body
                .split('\n')
                .filter(
                  (l) =>
                    !l.startsWith('> ⏳') &&
                    !l.startsWith('> ❌ CI failed before'),
                );
              lines.splice(1, 0, banner);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: lines.join('\n'),
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n> ⏳ CI running for \`${sha}\` — [run](${runUrl}).`,
              });
            }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          submodules: true
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Setup node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Prepare yarn 4
        run: corepack prepare yarn@4.9.1 --activate

      - name: Detect tests to burn in
        # New and modified tests must pass a burn-in (repeated runs, retries
        # disabled) before joining the suite; the burn-in job below runs
        # them and the verdict job enforces the result. Targets are
        # file:line tests, or whole spec files when shared code changed.
        id: burn-in-specs
        working-directory: e2e-pw
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SPECS=$(node ../.github/scripts/burn-in-specs.mjs)
          COUNT=0
          if [ -n "$SPECS" ]; then
            COUNT=$(printf '%s\n' "$SPECS" | wc -l | tr -d ' ')
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "specs<<BURN_IN_EOF"
            printf '%s\n' "$SPECS"
            echo "BURN_IN_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "burn-in: $COUNT target(s)"

      - name: Compute app tree hash
        id: app-tree-hash
        run: echo "hash=$(git rev-parse HEAD:app)" >> $GITHUB_OUTPUT

      - name: Cache built app static assets
        id: app-static-cache
        uses: actions/cache@v5
        with:
          path: fiftyone/server/static
          key: app-static-${{ runner.os }}-${{ steps.app-tree-hash.outputs.hash }}

      - name: Cache Node Modules
        id: app-node-cache
        uses: actions/cache@v5
        with:
          path: |
            app/node_modules
            app/.yarn/cache
          key: node-modules-${{ hashFiles('app/yarn.lock') }}

      - name: Install app
        if: steps.app-static-cache.outputs.cache-hit != 'true'
        run: yarn install
        working-directory: app

      - name: Build app
        if: steps.app-static-cache.outputs.cache-hit != 'true'
        run: make app

      - name: Bundle built app static assets
        run: tar -czf e2e-app-static.tgz fiftyone/server/static

      - name: Upload built app static assets
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-static
          path: e2e-app-static.tgz
          retention-days: 1

      - name: Cache E2E Node Modules
        id: e2e-node-cache
        uses: actions/cache@v5
        with:
          path: |
            e2e-pw/node_modules
          key: node-modules-${{ hashFiles('e2e-pw/yarn.lock') }}

      - name: Install E2E dependencies
        run: yarn install
        working-directory: e2e-pw

  test-e2e:
    needs: prepare-e2e
    # Hard budget: a shard that can't finish in 30 minutes is a failure by
    # policy, and the verdict job fails whenever a shard job does.
    # (fiftyone-teams runs the same suite ~1.6x slower.)
    timeout-minutes: 30
    # downstream repos reusing this workflow can point shards at a
    # larger runner spec via repo var
    runs-on: ${{ vars.FIFTYONE_E2E_RUNNER || 'ubuntu-latest' }}
    # The prebaked image (built by build-ci-images.yml) carries Python +
    # fiftyone's dependency tree, Node/Yarn, ffmpeg, and Chromium, so shard
    # jobs skip all toolchain setup.
    container:
      # fiftyone-teams overrides the image name via repo var (superset deps)
      image: ${{ vars.FIFTYONE_E2E_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-e2e' }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chromium needs more than Docker's default 64MB /dev/shm
      options: --shm-size=2gb
    name: Run e2e shard ${{ matrix.shard }}/8 (report-only, Mongo ${{ matrix.mongodb-version }})
    env:
      FIFTYONE_DO_NOT_TRACK: true
      FIFTYONE_APP_DEFAULT_QUERY_PERFORMANCE: false
      # Job containers reach service containers by service name, not localhost
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DATABASE_NAME: playwright
      ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      UV_PROJECT_ENVIRONMENT: /opt/fiftyone-venv
      FIFTYONE_PLUGINS_DIR: ${{ github.workspace }}/e2e-pw/src/shared/assets/plugins
      VFF_EXP_ANNOTATION: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        mongodb-version:
          - "latest"
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      # Run MongoDB as a service container rather than via a Docker-based
      # action. Container actions are built from `docker:latest` at job start
      # (before any step runs), so the previous `supercharge/mongodb-github-action`
      # added an extra, unauthenticated Docker Hub pull that intermittently timed
      # out. The runner's docker daemon pulls `mongo` directly here, with native
      # health checks and retries.
      mongo:
        image: mongo:${{ matrix.mongodb-version }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          submodules: true
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Download built app static assets
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-static

      - name: Restore built app static assets
        run: tar -xzf e2e-app-static.tgz -C .

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-suffix: e2e
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync e2e environment
        run: >-
          uv sync --locked --no-default-groups
          --extra multimodal --group e2e

      - name: Activate synced e2e environment
        run: echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: uv run --locked --no-sync python tests/utils/setup_config.py

      - name: Cache E2E Node Modules
        id: e2e-node-cache
        uses: actions/cache@v5
        with:
          path: |
            e2e-pw/node_modules
          key: node-modules-${{ hashFiles('e2e-pw/yarn.lock') }}

      - name: Install E2E dependencies
        run: yarn install
        working-directory: e2e-pw

      - name: Install Chromium if the lockfile moved past the baked browser
        # no-op when the image's browser matches; lets Playwright-upgrade
        # PRs validate themselves before the image rebuilds
        run: yarn playwright install chromium
        working-directory: e2e-pw

      - name: Run Playwright tests
        # Report-only: failed specs are surfaced by the e2e verdict job from
        # the merged blob reports. A red shard means infra death (timeout,
        # lost runner), not a test failure. Specs are assigned to shards by
        # duration (.github/scripts/pack-shards.mjs), not Playwright's count-based
        # sharding, so no shard is bottlenecked by the heavy spec families.
        run: |
          FILES=$(node ../.github/scripts/pack-shards.mjs ${{ matrix.shard }} 8)
          if [ -z "$FILES" ]; then
            echo "no specs assigned to shard ${{ matrix.shard }}"
          else
            yarn e2e $FILES ||
              echo "::warning::shard ${{ matrix.shard }} had failing specs; see the e2e verdict job"
          fi
        working-directory: e2e-pw

      - name: Lint Playwright tests
        run: yarn lint
        working-directory: e2e-pw

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-blob-shard-${{ matrix.shard }}
          path: e2e-pw/blob-report/
          # 3 days so reports from Friday/weekend runs survive into Monday.
          retention-days: 3

  burn-in:
    needs: prepare-e2e
    # New and modified tests must pass 10 runs with retries disabled before
    # joining the suite — flaky-on-arrival tests fail here instead of landing
    # and flaking later. Targets are individual tests where the diff maps to
    # them, whole spec files when shared code changed (see
    # .github/scripts/burn-in-specs.mjs). Report-only like the shards: the verdict
    # job enforces the outcome, so a red burn-in job means infra death, not
    # a failing spec.
    if: needs.prepare-e2e.outputs.burn-in-count != '0'
    # 10 repeats of several typical spec files fit this budget; a PR that
    # adds more should land them in pieces.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      # fiftyone-teams overrides the image name via repo var (superset deps)
      image: ${{ vars.FIFTYONE_E2E_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-e2e' }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chromium needs more than Docker's default 64MB /dev/shm
      options: --shm-size=2gb
    name: Burn in new e2e specs (report-only)
    env:
      FIFTYONE_DO_NOT_TRACK: true
      FIFTYONE_APP_DEFAULT_QUERY_PERFORMANCE: false
      # Job containers reach service containers by service name, not localhost
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DATABASE_NAME: playwright
      ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      UV_PROJECT_ENVIRONMENT: /opt/fiftyone-venv
      FIFTYONE_PLUGINS_DIR: ${{ github.workspace }}/e2e-pw/src/shared/assets/plugins
      VFF_EXP_ANNOTATION: true
    defaults:
      run:
        shell: bash
    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          submodules: true
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Download built app static assets
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-static

      - name: Restore built app static assets
        run: tar -xzf e2e-app-static.tgz -C .

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-suffix: e2e-burn-in
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync e2e environment
        run: >-
          uv sync --locked --no-default-groups
          --extra multimodal --group e2e

      - name: Activate synced e2e environment
        run: echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Configure
        id: test_config
        run: uv run --locked --no-sync python tests/utils/setup_config.py

      - name: Cache E2E Node Modules
        id: e2e-node-cache
        uses: actions/cache@v5
        with:
          path: |
            e2e-pw/node_modules
          key: node-modules-${{ hashFiles('e2e-pw/yarn.lock') }}

      - name: Install E2E dependencies
        run: yarn install
        working-directory: e2e-pw

      - name: Install Chromium if the lockfile moved past the baked browser
        # no-op when the image's browser matches; lets Playwright-upgrade
        # PRs validate themselves before the image rebuilds
        run: yarn playwright install chromium
        working-directory: e2e-pw

      - name: Burn in new and modified tests
        # --retries=0 because retries mask exactly the flakiness this gate
        # screens for; --trace so the rare burn-in failure is debuggable
        # (retries never happen here, so the config's on-all-retries mode
        # would capture nothing). --workers=50% (1 worker per 2 vCPUs)
        # overrides the config's 1-worker CI default: the parallelism both
        # shortens the burn-in and adds contention pressure a spec must
        # tolerate before joining the suite.
        env:
          TARGETS: ${{ needs.prepare-e2e.outputs.burn-in-specs }}
        run: |
          printf 'burning in:\n%s\n' "$TARGETS"
          yarn e2e $TARGETS --repeat-each=10 --retries=0 --workers=50% --trace=retain-on-failure ||
            echo "::warning::burn-in had failing runs; see the e2e verdict job"
        working-directory: e2e-pw

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-blob-burn-in
          path: e2e-pw/blob-report/
          # 3 days so reports from Friday/weekend runs survive into Monday.
          retention-days: 3

  e2e-verdict:
    needs: [prepare-e2e, test-e2e, burn-in]
    # The single authoritative e2e check: shard and burn-in jobs are
    # report-only, so this job alone decides pass/fail from the merged
    # reports. Runs on 'cancelled' too — timeout-minutes kills report as
    # cancelled, and those runs still need a comment and a red verdict. A
    # run-level cancellation force-cancels this job anyway. (burn-in being
    # skipped is the normal no-new-specs case, so it must not gate here.)
    if: always() && needs.test-e2e.result != 'skipped'
    timeout-minutes: 15
    # gates the merge, so it follows the shards' runner rather than
    # queueing on a busy standard pool
    runs-on: ${{ vars.FIFTYONE_E2E_RUNNER || 'ubuntu-latest' }}
    container:
      # fiftyone-teams overrides the image name via repo var (superset deps)
      image: ${{ vars.FIFTYONE_E2E_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-e2e' }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    name: e2e verdict
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          sparse-checkout: |
            /e2e-pw/**
            /.github/scripts/**
          sparse-checkout-cone-mode: false

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-shard-*
          path: e2e-pw/all-blob-reports
          merge-multiple: true

      - name: Download burn-in blob report
        if: needs.prepare-e2e.outputs.burn-in-count != '0'
        # a burn-in job that died before uploading has no artifact; the
        # enforce step fails on its job result, so don't fail the download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-blob-burn-in
          path: e2e-pw/burn-in-blob-report

      - name: Cache E2E Node Modules
        id: e2e-node-cache
        uses: actions/cache@v5
        with:
          path: |
            e2e-pw/node_modules
          key: node-modules-${{ hashFiles('e2e-pw/yarn.lock') }}

      - name: Install E2E dependencies
        run: yarn install
        working-directory: e2e-pw

      - name: Merge shard reports
        working-directory: e2e-pw
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-results.json
        run: yarn playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Upload merged report
        id: upload-merged
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-merged
          path: e2e-pw/playwright-report/
          # 3 days so reports from Friday/weekend runs survive into Monday.
          retention-days: 3

      - name: Merge burn-in report
        # kept separate from the shard merge so 10x-repeated specs don't
        # inflate the suite's counts; reuses the default report dir now that
        # the shard report has been uploaded
        if: needs.prepare-e2e.outputs.burn-in-count != '0'
        working-directory: e2e-pw
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: burn-in-results.json
        run: |
          # always cleared: a missing blob report must not re-upload the
          # already-uploaded shard report under the burn-in name
          rm -rf playwright-report
          if ls burn-in-blob-report/*.zip >/dev/null 2>&1; then
            yarn playwright merge-reports --reporter html,json ./burn-in-blob-report
          else
            echo "no burn-in blob report; the enforce step fails on the job result"
          fi

      - name: Upload burn-in report
        id: upload-burn-in
        if: needs.prepare-e2e.outputs.burn-in-count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-burn-in
          path: e2e-pw/playwright-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Summarize
        working-directory: e2e-pw
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          EXPECTED_SHARDS: "8"
          BURN_IN_COUNT: ${{ needs.prepare-e2e.outputs.burn-in-count }}
          BURN_IN_RESULT: ${{ needs.burn-in.result }}
          BURN_IN_REPORT_URL: ${{ steps.upload-burn-in.outputs.artifact-url }}
          REPORT_URL: ${{ steps.upload-merged.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # sibling suite results + the e2e pipeline start (prepare-e2e)
          curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > run-jobs.json || echo '{}' > run-jobs.json
          RUN_STARTED_AT=$(node -e "const j=require('./run-jobs.json').jobs??[];const p=j.find((x)=>x.name.endsWith('Prepare e2e assets'));console.log(p?.started_at??'')")
          export RUN_STARTED_AT
          node ../.github/scripts/report-summary.mjs merged-results.json all-blob-reports run-jobs.json burn-in-results.json > e2e-summary.md
          cat e2e-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post authoritative PR comment
        # Same-repo PRs only: fork tokens are read-only, and the job summary
        # above still carries the itemized list there.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('e2e-pw/e2e-summary.md', 'utf8');
            const flavor = process.env.GITHUB_REPOSITORY.endsWith(
              'fiftyone-teams',
            )
              ? 'FOE'
              : 'OSS';
            const marker = `<!-- ci-report:${flavor} -->`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce verdict
        working-directory: e2e-pw
        env:
          EXPECTED_SHARDS: "8"
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          BURN_IN_COUNT: ${{ needs.prepare-e2e.outputs.burn-in-count }}
          BURN_IN_RESULT: ${{ needs.burn-in.result }}
        run: node ../.github/scripts/enforce-verdict.mjs merged-results.json all-blob-reports burn-in-results.json

  e2e-aborted:
    needs: [prepare-e2e, test-e2e]
    # prepare-e2e failing skips the shards, which skips the verdict — the
    # only job that rewrites the in-progress banner — so the authoritative
    # comment would read "running" forever. Same-repo PRs only, matching
    # the banner stamp.
    if: >-
      always() && needs.test-e2e.result == 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    runs-on: ubuntu-latest
    name: Mark the CI comment failed
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const flavor = process.env.GITHUB_REPOSITORY.endsWith(
              'fiftyone-teams',
            )
              ? 'FOE'
              : 'OSS';
            const marker = `<!-- ci-report:${flavor} -->`;
            const sha = context.payload.pull_request.head.sha.slice(0, 10);
            const runUrl = `${context.serverUrl}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find((c) => c.body.includes(marker));
            if (!existing) return;
            const lines = existing.body.split('\n');
            const idx = lines.findIndex((l) => l.startsWith('> ⏳'));
            // a newer run may have stamped its own banner; leave that alone
            if (
              idx === -1 ||
              !lines[idx].includes(`/actions/runs/${context.runId})`)
            ) {
              return;
            }
            const hasEarlier = lines.some(
              (l, i) => i > 0 && i !== idx && l.trim() !== '',
            );
            lines[idx] =
              `> ❌ CI failed before e2e could run for \`${sha}\` — [run](${runUrl}).` +
              (hasEarlier ? ' Results below are from an earlier run.' : '');
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: lines.join('\n'),
            });
