name: Windows Tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the Windows test matrix
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'

jobs:
  test-python:
    name: Python ${{ matrix.python }} (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      FIFTYONE_DO_NOT_TRACK: true
      PYTHONPATH: .
      # Assuming no pytest should take more than 60 seconds
      PYTEST_TIMEOUT: 60
      TEST_GROUP: ${{ matrix.profile == 'core' && 'test-core' || 'test' }}
      TEST_MARKER: >-
        ${{ matrix.profile == 'core' &&
        'not ml and not cloud' || 'ml or cloud' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        python: ${{ fromJSON(inputs.python-versions) }}
        profile:
          - core
          - ml-cloud
        exclude:
          - python: "3.11"
            profile: ml-cloud
          - python: "3.12"
            profile: ml-cloud
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-suffix: test-${{ matrix.python }}-${{ matrix.profile }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Setup FFmpeg
        id: setup-ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        background: true
      - name: Sync test environment
        run: >-
          uv sync --locked --no-default-groups
          --extra multimodal --group "$TEST_GROUP"
      - name: Validate test environment
        run: >-
          uv run --locked --no-sync python
          tests/utils/validate_test_environment.py
          "${{ matrix.profile }}"
      - name: Configure
        run: uv run --locked --no-sync python tests/utils/setup_config.py

      - name: Wait for FFmpeg
        wait: setup-ffmpeg

      # Important: use pytest_wrapper.py instead of pytest directly to ensure
      # that services shut down cleanly and do not conflict with steps later in
      # this workflow
      - name: Run tests
        run: |
          uv run --locked --no-sync python tests/utils/pytest_wrapper.py tests/ --verbose \
            -m "$TEST_MARKER" \
            --ignore tests/benchmarking/ \
            --ignore tests/isolated/ \
            --ignore tests/utils/ \
            --ignore tests/intensive/ \
            --ignore tests/no_wrapper

      - name: Run no wrapper tests
        if: matrix.profile == 'core'
        run: uv run --locked --no-sync pytest tests/no_wrapper --verbose

      # Intended to run even if the tests above failed
      - name: Run isolated tests
        if: >-
          matrix.profile == 'core' &&
          (success() || failure())
        run: |
          find tests/isolated/ -name '*.py' -print0 | xargs -0 --verbose -n1 \
            uv run --locked --no-sync python tests/utils/pytest_wrapper.py --verbose
