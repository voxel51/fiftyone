name: Build docs
on:
  push:
    branches:
      - docs-*
      - github-actions-*
      - release/*
    tags:
      - dev-docs-publish
      - docs-publish
      - v*
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
      - examples/**
      - fiftyone/**
      - "**.py"
      - "**.md"
      - "**.rst"
  pull_request:
    branches:
      - develop
      - main
      - release/*
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
      - examples/**
      - fiftyone/**
      - plugins/**
      - pyproject.toml
      - setup.py
      - uv.lock
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIFTYONE_DO_NOT_TRACK: true
      DOCSEARCH_API_KEY: ${{ secrets.DOCSEARCH_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.FIFTYONE_GITHUB_TOKEN }}
    steps:
      - name: Clone fiftyone for tag builds
        if: github.ref_type == 'tag'
        uses: actions/checkout@v7
        with:
          # Fetch full history for rev-parse to work
          fetch-depth: 0
      - name: Clone fiftyone for branch builds
        if: github.ref_type == 'branch'
        uses: actions/checkout@v7
      - name: Get Branch Name
        id: get_branch
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_SHA=$(git rev-parse ${{ github.ref }})
            case "${{ github.ref_name }}" in
              docs-publish|v*)
                MAIN_SHA=$(git rev-parse origin/main)
                if [[ "${MAIN_SHA}" == "${TAG_SHA}" ]]; then
                  echo "branch_name=main" >> "${GITHUB_OUTPUT}"
                else
                  echo "docs-publish should only be performed on 'main'"
                  exit 1
                fi
                ;;
              dev-docs-publish)
                DEVELOP_SHA=$(git rev-parse origin/develop)
                if [[ "${DEVELOP_SHA}" == "${TAG_SHA}" ]]; then
                  echo "branch_name=develop" >> "${GITHUB_OUTPUT}"
                else
                  echo "dev-docs-publish should only be performed on 'develop'"
                  exit 1
                fi
                ;;
            esac
          else
            case "${{ github.ref_name }}" in
              main|develop)
                echo "branch_name=${{ github.ref_name }}" >> "${GITHUB_OUTPUT}"
                ;;
              *)
                # use `main` because arbitrary branch names may not exist on `fiftyone-teams` or `eta`
                echo "branch_name=main" >> "${GITHUB_OUTPUT}"
                ;;
            esac
          fi
      - name: Checkout fiftyone-teams
        uses: actions/checkout@v7
        with:
          repository: voxel51/fiftyone-teams
          path: fiftyone-teams
          token: ${{ secrets.RO_FOT_FG_PAT }}
          ref: ${{ steps.get_branch.outputs.branch_name }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-suffix: docs-3.12
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Free Disk Space (Ubuntu) # standard runner's 14 GB available disk size isn't enough. Need at least 22 GB free.
        uses: ./.github/actions/free-disk-space
      - name: Sync docs environment
        id: sync-docs-environment
        run: uv sync --locked --no-default-groups --group docs
        background: true
      - name: Build ETA from source
        run: |
          git clone https://github.com/voxel51/eta eta --depth 1 --branch "${{ steps.get_branch.outputs.branch_name }}"
          cd eta
          uv build --wheel

      - name: Setup node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable
      - name: Prepare yarn 4
        run: corepack prepare yarn@4.12.0 --activate

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v6
        with:
          path: |
            app/node_modules
            app/.yarn/cache
          key: node-modules-${{ hashFiles('app/yarn.lock') }}
      - name: Install app
        run: cd app && yarn install
      - name: Wait for docs environment
        wait: sync-docs-environment
      - name: Install system dependencies and source ETA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          uv pip install --python "$VIRTUAL_ENV/bin/python" --no-deps eta/dist/*.whl
      - name: Build docs
        # PR builds skip the markdown mirror pass; it is only needed for
        # the published site
        run: |
          ./docs/generate_docs.bash -t fiftyone-teams ${{ github.event_name == 'pull_request' && '-m' || '' }}
      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/build/html/
    outputs:
      branch_name: ${{ steps.get_branch.outputs.branch_name}}

  publish:
    needs: [build]
    if: |
      needs.build.outputs.branch_name == 'main' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/docs-publish')
    runs-on: ubuntu-latest
    steps:
      - name: Download docs
        id: download-docs
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs-download/
        background: true
      - name: Authorize gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.DOCS_GCP_CREDENTIALS }}"
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Wait for docs
        wait: download-docs
      - name: publish
        run: gsutil -m rsync -dR -x '^SBOMs/.*' docs-download gs://docs.voxel51.com

  dev-publish:
    needs: [build]
    if: |
      needs.build.outputs.branch_name == 'develop' &&
      github.ref == 'refs/tags/dev-docs-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Download docs
        id: download-docs
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs-download/
        background: true
      - name: Authorize gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.DOCS_GCP_CREDENTIALS }}"
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Wait for docs
        wait: download-docs
      - name: publish
        run: gsutil -m rsync -dR -x '^robots.txt' docs-download gs://docs.dev.voxel51.com
