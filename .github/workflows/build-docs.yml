name: Build docs
on:
  push:
    branches:
      - docs-*
      - github-actions-*
      - release/*
    tags:
      - dev-docs-publish
      - docs-publish
      - v*
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
      - examples/**
      - fiftyone/**
      - "**.py"
      - "**.md"
      - "**.rst"
  pull_request:
    branches:
      - develop
      - release/*
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
      - examples/**
      - fiftyone/**
      - plugins/**
      - requirements/**
      - setup.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs cannot access the secrets this job requires (RO_FOT_FG_PAT,
    # FIFTYONE_GITHUB_TOKEN), so the build is guaranteed to fail; skip it
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FIFTYONE_DO_NOT_TRACK: true
      DOCSEARCH_API_KEY: ${{ secrets.DOCSEARCH_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.FIFTYONE_GITHUB_TOKEN }}
    steps:
      - name: Clone fiftyone for tag builds
        if: github.ref_type == 'tag'
        uses: actions/checkout@v7
        with:
          # Fetch full history for rev-parse to work
          fetch-depth: 0
      - name: Clone fiftyone for branch builds
        if: github.ref_type == 'branch'
        uses: actions/checkout@v7
      - name: Get Branch Name
        id: get_branch
        env:
          RO_FOT_FG_PAT: ${{ secrets.RO_FOT_FG_PAT }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_SHA=$(git rev-parse ${{ github.ref }})
            case "${{ github.ref_name }}" in
              docs-publish|v*)
                # Published docs must match the latest released product: the
                # tag must be the newest final release tag, or sit on top of
                # it (a docs/v* line carrying doc cherry-picks). Enterprise
                # docs content builds from the latest teams-v* release tag;
                # branch_name=main is only the eta clone ref below (eta's
                # current branch, not a release pointer).
                LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
                if git merge-base --is-ancestor "$(git rev-parse ${LATEST}^{commit})" "${TAG_SHA}"; then
                  echo "branch_name=main" >> "${GITHUB_OUTPUT}"
                  TEAMS_TAG=$(git ls-remote --tags "https://x-access-token:${RO_FOT_FG_PAT}@github.com/voxel51/fiftyone-teams.git" 'refs/tags/teams-v*' \
                    | awk -F/ '{print $NF}' | grep -E '^teams-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
                  echo "teams_ref=${TEAMS_TAG}" >> "${GITHUB_OUTPUT}"
                else
                  echo "docs publish only from the latest release (${LATEST}) or a docs/v* line on it"
                  exit 1
                fi
                ;;
              dev-docs-publish)
                DEVELOP_SHA=$(git rev-parse origin/develop)
                if [[ "${DEVELOP_SHA}" == "${TAG_SHA}" ]]; then
                  echo "branch_name=develop" >> "${GITHUB_OUTPUT}"
                else
                  echo "dev-docs-publish should only be performed on 'develop'"
                  exit 1
                fi
                ;;
            esac
          else
            case "${{ github.ref_name }}" in
              main|develop)
                echo "branch_name=${{ github.ref_name }}" >> "${GITHUB_OUTPUT}"
                ;;
              *)
                # use `main` because arbitrary branch names may not exist on `fiftyone-teams` or `eta`
                echo "branch_name=main" >> "${GITHUB_OUTPUT}"
                ;;
            esac
          fi
      - name: Checkout fiftyone-teams
        uses: actions/checkout@v7
        with:
          repository: voxel51/fiftyone-teams
          path: fiftyone-teams
          token: ${{ secrets.RO_FOT_FG_PAT }}
          ref: ${{ steps.get_branch.outputs.teams_ref || steps.get_branch.outputs.branch_name }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/docs.txt
            setup.py
      - name: Free Disk Space (Ubuntu) # standard runner's 14 GB available disk size isn't enough. Need at least 22 GB free.
        uses: ./.github/actions/free-disk-space
      - name: Install pip dependencies
        run: |
          pip install --upgrade pip setuptools wheel build
      - name: Install ETA from source
        run: |
          git clone https://github.com/voxel51/eta eta --depth 1 --branch "${{ steps.get_branch.outputs.branch_name }}"
          cd eta
          python -Im build
          pip install ./dist/*.whl
      - name: Install
        id: install-docs-dependencies
        run: |
          echo "Installing system dependencies"
          sudo apt-get install pandoc
          echo "Installing docs requirements"
          pip install -r requirements/docs.txt
          echo "Installing fiftyone-brain and fiftyone-db"
          pip install fiftyone-brain fiftyone-db
          echo "Installing fiftyone"
          pip install .
        background: true

      - name: Setup node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare yarn
        uses: ./.github/actions/setup-yarn

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v6
        with:
          path: |
            app/node_modules
            app/.yarn/cache
          key: node-modules-${{ hashFiles('app/yarn.lock') }}
      - name: Install app
        run: cd app && yarn install
      - name: Wait for docs dependencies
        wait: install-docs-dependencies
      - name: Build docs
        # PR builds skip the markdown mirror pass; it is only needed for
        # the published site
        run: |
          ./docs/generate_docs.bash -t fiftyone-teams ${{ github.event_name == 'pull_request' && '-m' || '' }}
      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/build/html/
    outputs:
      branch_name: ${{ steps.get_branch.outputs.branch_name}}

  publish:
    needs: [build]
    if: |
      needs.build.outputs.branch_name == 'main' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/docs-publish')
    runs-on: ubuntu-latest
    steps:
      - name: Download docs
        id: download-docs
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs-download/
        background: true
      - name: Authorize gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.DOCS_GCP_CREDENTIALS }}"
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Wait for docs
        wait: download-docs
      - name: publish
        run: gsutil -m rsync -dR -x '^SBOMs/.*' docs-download gs://docs.voxel51.com

  dev-publish:
    needs: [build]
    if: |
      needs.build.outputs.branch_name == 'develop' &&
      github.ref == 'refs/tags/dev-docs-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Download docs
        id: download-docs
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs-download/
        background: true
      - name: Authorize gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.DOCS_GCP_CREDENTIALS }}"
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Wait for docs
        wait: download-docs
      - name: publish
        run: gsutil -m rsync -dR -x '^robots.txt' docs-download gs://docs.dev.voxel51.com
