name: Builds and publishes the fiftyone-db package

on:
  push:
    tags:
      - db-v[0-9]+.[0-9]+.[0-9]+
      - db-v[0-9]+.[0-9]+.[0-9]+rc[0-9]+
  pull_request:
    paths:
      - package/db/**
      - .github/workflows/build-db.yml

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - sdist
          - darwin-arm64
          - darwin-x86_64
          - windows-x86_64
    steps:
      - name: Clone fiftyone
        uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade \
            pip setuptools wheel build \
            twine==6.2.0 check-wheel-contents==0.6.3
      - name: Set environment
        env:
          RELEASE_TAG: ${{ github.ref }}
        run: |
          if [[ $RELEASE_TAG =~ ^refs\/tags\/db-v[0-9]+.[0-9]+.[0-9]+rc[0-9]+ ]]; then
             echo "RELEASE_VERSION=$(echo "${{ github.ref }}" | sed "s/^refs\/tags\/db-v//")" >> $GITHUB_ENV
          fi
      - name: Build Darwin arm64 wheel
        if: ${{ matrix.platform == 'darwin-arm64' }}
        run: |
          cd package/db
          FODB_MACHINE=arm64 FODB_SYSTEM=Darwin python -Im build
      - name: Build Darwin x86_64 wheel
        if: ${{ matrix.platform == 'darwin-x86_64' }}
        run: |
          cd package/db
          FODB_MACHINE=x86_64 FODB_SYSTEM=Darwin python -Im build
      - name: Build Windows x86_64 wheel
        if: ${{ matrix.platform == 'windows-x86_64' }}
        run: |
          cd package/db
          FODB_MACHINE=x86_64 FODB_SYSTEM=Windows python -Im build
      - name: Build sdist
        if: ${{ matrix.platform == 'sdist' }}
        run: |
          cd package/db
          python -Im build --sdist
      - name: Validate sdist metadata
        if: ${{ matrix.platform == 'sdist' }}
        run: python -m twine check --strict package/db/dist/*.tar.gz
      - name: Validate wheel contents
        if: ${{ matrix.platform != 'sdist' }}
        run: |
          cd package/db
          python -m twine check --strict dist/*.whl
          check-wheel-contents dist/*.whl
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_name = next(
                  name
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              )
              package_metadata = BytesParser().parsebytes(
                  archive.read(metadata_name)
              )

              if package_metadata["Name"] != "fiftyone_db":
                  raise SystemExit("unexpected fiftyone-db project name")

              binaries = [
                  name
                  for name in names
                  if name.endswith(("/mongod", "/mongod.exe"))
              ]
              if len(binaries) != 1 or archive.getinfo(binaries[0]).file_size == 0:
                  raise SystemExit("wheel must contain exactly one mongod binary")

              forbidden = [
                  name
                  for name in names
                  if "tests" in Path(name).parts
                  or "__pycache__" in Path(name).parts
                  or name.endswith((".pyc", ".pyo"))
              ]
              if forbidden:
                  raise SystemExit(
                      "source-only files found in wheel: "
                      + ", ".join(forbidden[:10])
                  )
          PY
      - name: Smoke test wheel in a clean target
        if: ${{ matrix.platform != 'sdist' }}
        run: |
          wheel=$(find package/db/dist -maxdepth 1 -name '*.whl' -print -quit)
          wheel_stem=${wheel%.whl}
          wheel_platform=${wheel_stem##*-}
          target="$RUNNER_TEMP/fiftyone-db-wheel"
          python -m pip install \
            --target "$target" \
            --platform "$wheel_platform" \
            --only-binary=:all: \
            --no-deps \
            "$wheel"
          cd "$RUNNER_TEMP"
          python -I - "$target" <<'PY'
          from importlib import metadata
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          sys.path.insert(0, str(target))

          distribution = next(
              dist
              for dist in metadata.distributions(path=[target])
              if dist.metadata["Name"] == "fiftyone_db"
          )
          if not distribution.version:
              raise SystemExit("installed fiftyone-db version is empty")

          import fiftyone.db as fodb

          binary_names = ("mongod", "mongod.exe")
          binaries = [
              Path(fodb.FIFTYONE_DB_BIN_DIR) / name
              for name in binary_names
              if (Path(fodb.FIFTYONE_DB_BIN_DIR) / name).is_file()
          ]
          if len(binaries) != 1 or binaries[0].stat().st_size == 0:
              raise SystemExit("installed mongod binary is missing or empty")
          PY
      - name: Upload
        uses: actions/upload-artifact@v7
        if: ${{ matrix.platform == 'sdist' }}
        with:
          name: dist-${{ matrix.platform }}
          path: package/db/dist/*.tar.gz
      - name: Upload wheel
        if: ${{ matrix.platform != 'sdist' }}
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: package/db/dist/*.whl

  test:
    runs-on: ubuntu-latest
    needs: build
    env:
      FIFTYONE_DO_NOT_TRACK: true
    steps:
      - name: Clone fiftyone
        uses: actions/checkout@v6
      - name: Download fiftyone-db
        id: download-fiftyone-db
        uses: actions/download-artifact@v8
        with:
          name: dist-sdist
          path: downloads
        background: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Wait for fiftyone-db
        wait: download-fiftyone-db
      - name: Install fiftyone-db
        run: |
          pip install downloads/fiftyone_db-*.tar.gz
      - name: Install test dependencies
        run: |
          pip install pytest
      - name: Run tests
        run: |
          cd package/db/
          python -m pytest --verbose tests/

  publish:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/db-v')
    environment: release # For trusted publishing. See below.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Utilize
      # [trusted publishers](https://docs.pypi.org/trusted-publishers/)
      # This will use OIDC to publish the dists/ package to pypi.
      # See
      # [fiftyone-db](https://pypi.org/manage/project/fiftyone-db/settings/publishing/)
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.0
