name: Build CI images

on:
  push:
    branches:
      - develop
    paths:
      - pyproject.toml
      - setup.py
      - uv.lock
      - e2e-pw/yarn.lock
      - e2e-pw/ci/Dockerfile
      - tests/ci/Dockerfile
      - .github/workflows/build-ci-images.yml
  workflow_dispatch:
    inputs:
      python-versions:
        description: >-
          JSON array of python versions to build test images for
        default: '["3.10", "3.11", "3.12", "3.13"]'
      build-e2e-image:
        description: Also rebuild the e2e image
        type: boolean
        default: true

# Serialize pushes of the mutable tags
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-e2e-image:
    if: github.event_name == 'push' || inputs.build-e2e-image
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Build and push e2e image
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        # the image's dependency tree exceeds the standard runner's
        # free disk during build
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e-pw/ci/Dockerfile
          push: true
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,scope=e2e-image,mode=max
          tags: |
            ${{ vars.FIFTYONE_E2E_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-e2e' }}:latest
            ${{ vars.FIFTYONE_E2E_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-e2e' }}:${{ github.sha }}

  build-test-image:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: >-
      Build and push test image
      (Python ${{ matrix.python }}, ${{ matrix.profile }})
    env:
      TEST_IMAGE_NAME: >-
        ${{ vars.FIFTYONE_TEST_IMAGE_NAME ||
        'ghcr.io/voxel51/fiftyone-test' }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions || '["3.10", "3.11", "3.12", "3.13"]') }}
        profile:
          - core
          - ml-cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        # the image's dependency tree exceeds the standard runner's
        # free disk during build
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/ci/Dockerfile
          push: true
          cache-from: >-
            type=gha,scope=test-image-${{ matrix.python }}-${{ matrix.profile }}
          cache-to: >-
            type=gha,scope=test-image-${{ matrix.python }}-${{ matrix.profile }},mode=max
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            TEST_PROFILE=${{ matrix.profile }}
          tags: |
            ${{ env.TEST_IMAGE_NAME }}:${{ matrix.python }}-${{ matrix.profile }}
            ${{ env.TEST_IMAGE_NAME }}:${{ matrix.python }}-${{ matrix.profile }}-${{ github.sha }}
            ${{ matrix.profile == 'ml-cloud' && format('{0}:{1}', env.TEST_IMAGE_NAME, matrix.python) || '' }}
            ${{ matrix.profile == 'ml-cloud' && format('{0}:{1}-{2}', env.TEST_IMAGE_NAME, matrix.python, github.sha) || '' }}
