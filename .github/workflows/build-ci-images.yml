name: Build CI images

on:
  push:
    branches:
      - develop
      # TODO: remove before merge — temporary trigger to bootstrap the images
      # from this branch so the PR's own CI can pull them
      - ben/e2e-speedups
    paths:
      - requirements/**
      - setup.py
      - e2e-pw/yarn.lock
      - e2e-pw/ci/Dockerfile
      - tests/ci/Dockerfile
      - .github/workflows/build-ci-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-e2e-image:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Build and push e2e image
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e-pw/ci/Dockerfile
          push: true
          tags: |
            ${{ vars.FIFTYONE_E2E_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-e2e' }}:latest
            ${{ vars.FIFTYONE_E2E_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-e2e' }}:${{ github.sha }}

  build-test-image:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Build and push test image (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/ci/Dockerfile
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
          tags: |
            ${{ vars.FIFTYONE_TEST_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-test' }}:${{ matrix.python }}
            ${{ vars.FIFTYONE_TEST_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-test' }}:${{ matrix.python }}-${{ github.sha }}
