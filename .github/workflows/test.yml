name: Test

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the Python test matrix
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'

jobs:
  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          submodules: true
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Setup node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable
      - name: Prepare yarn 4
        run: corepack prepare yarn@4.9.1 --activate

      - name: Cache
        id: node-cache
        uses: actions/cache@v5
        with:
          path: |
            app/node_modules
            app/.yarn/cache
          key: node-modules-${{ hashFiles('app/yarn.lock') }}
      - name: Install
        run: cd app && yarn install
      - name: Run
        run: cd app && yarn test

  test-python:
    name: Python ${{ matrix.python }} (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The core leg uses a clean Python base until the new profile tags are
    # first published. The ml-cloud leg keeps using the existing test image.
    container:
      image: >-
        ${{ matrix.profile == 'core' &&
        format('python:{0}-slim-bookworm', matrix.python) ||
        format('{0}:{1}', vars.FIFTYONE_TEST_IMAGE_NAME ||
        'ghcr.io/voxel51/fiftyone-test', matrix.python) }}
    env:
      FIFTYONE_DO_NOT_TRACK: true
      PYTHONPATH: .
      # Assuming no pytest should take more than 60 seconds
      PYTEST_TIMEOUT: 60
      TEST_GROUP: ${{ matrix.profile == 'core' && 'test-core' || 'test' }}
      TEST_MARKER: >-
        ${{ matrix.profile == 'core' &&
        'not ml and not cloud' || 'ml or cloud' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python: ${{ fromJSON(inputs.python-versions) }}
        profile:
          - core
          - ml-cloud
    defaults:
      run:
        shell: bash
    steps:
      - name: Install core system dependencies
        if: matrix.profile == 'core'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git ffmpeg libcurl4
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-suffix: test-${{ matrix.python }}-${{ matrix.profile }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync test environment
        run: >-
          uv sync --locked --no-default-groups
          --extra multimodal --group "$TEST_GROUP"

      - name: Validate test environment
        run: >-
          uv run --locked --no-sync python
          tests/utils/validate_test_environment.py
          "${{ matrix.profile }}"

      - name: Configure
        run: uv run --locked --no-sync python tests/utils/setup_config.py

      # Important: use pytest_wrapper.py instead of pytest directly to ensure
      # that services shut down cleanly and do not conflict with steps later in
      # this workflow
      - name: Run tests
        run: |
          mkdir -p junit
          uv run --locked --no-sync python tests/utils/pytest_wrapper.py tests/ --verbose \
            --junitxml junit/main.xml \
            -m "$TEST_MARKER" \
            --ignore tests/benchmarking/ \
            --ignore tests/isolated/ \
            --ignore tests/utils/ \
            --ignore tests/intensive/ \
            --ignore tests/no_wrapper

      - name: Audit test partitions
        if: matrix.python == '3.13' && matrix.profile == 'ml-cloud'
        run: >-
          uv run --locked --no-sync python
          tests/utils/validate_test_partitions.py

      - name: Run no wrapper tests
        if: matrix.profile == 'core'
        run: |
          uv run --locked --no-sync pytest tests/no_wrapper --verbose \
            --junitxml junit/no-wrapper.xml

      # Intended to run even if the tests above failed
      - name: Run isolated tests
        if: >-
          matrix.profile == 'core' &&
          (success() || failure())
        run: |
          mkdir -p junit
          fail=0
          while IFS= read -r -d '' f; do
            rel="${f#tests/isolated/}"
            mkdir -p "junit/isolated/$(dirname "$rel")"
            uv run --locked --no-sync python tests/utils/pytest_wrapper.py \
              "$f" --verbose \
              --junitxml "junit/isolated/${rel%.py}.xml" || fail=1
          done < <(find tests/isolated/ -name '*.py' -print0)
          exit $fail

      - name: Upload pytest results
        # junit reports feed the python section of the authoritative CI
        # comment (.github/scripts/python-section.mjs)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            pytest-results-${{ matrix.python }}-${{ matrix.profile }}
          path: junit/
          if-no-files-found: ignore
          retention-days: 3
