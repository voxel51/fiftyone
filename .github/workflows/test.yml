name: Test

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the Python test matrix
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'

jobs:
  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          submodules: true
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false

      - name: Setup node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare yarn
        uses: ./.github/actions/setup-yarn

      - name: Cache
        id: node-cache
        uses: actions/cache@v5
        with:
          path: |
            app/node_modules
            app/.yarn/cache
          key: node-modules-${{ hashFiles('app/yarn.lock') }}
      - name: Install
        run: cd app && yarn install
      - name: Run
        run: cd app && yarn test

  test-python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The prebaked image (built by build-ci-images.yml) carries the matching
    # Python plus fiftyone's dependency tree and ffmpeg, so test jobs skip
    # all toolchain setup.
    container:
      # fiftyone-teams overrides the image name via repo var (superset deps)
      image: ${{ vars.FIFTYONE_TEST_IMAGE_NAME || 'ghcr.io/voxel51/fiftyone-test' }}:${{ matrix.python }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FIFTYONE_DO_NOT_TRACK: true
      # Assuming no pytest should take more than 60 seconds
      PYTEST_TIMEOUT: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # yarn install runs PR-controlled lifecycle scripts
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false
      - name: Install fiftyone
        # dependencies are baked into the image; this only builds fiftyone
        # itself from the PR's source (plus any deps added since the last
        # image build)
        run: |
          uv pip install --system '.[multimodal]' -r requirements/github.txt
      - name: Configure
        run: |
          python tests/utils/setup_config.py

      # Important: use pytest_wrapper.py instead of pytest directly to ensure
      # that services shut down cleanly and do not conflict with steps later in
      # this workflow
      - name: Run tests
        run: |
          mkdir -p junit
          python tests/utils/pytest_wrapper.py tests/ --verbose \
            --junitxml junit/main.xml \
            --cov --cov-report xml \
            --ignore tests/benchmarking/ \
            --ignore tests/isolated/ \
            --ignore tests/utils/ \
            --ignore tests/intensive/ \
            --ignore tests/no_wrapper
      - name: Upload
        if: ${{ !startsWith(matrix.os, 'windows') && matrix.python == '3.13' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
      - name: Run no wrapper tests
        run: |
          pytest tests/no_wrapper --verbose --junitxml junit/no-wrapper.xml
      # Intended to run even if the tests above failed
      - name: Run isolated tests
        if: success() || failure()
        # every file runs even if one fails, matching xargs semantics, with
        # a junit report per file
        run: |
          mkdir -p junit
          fail=0
          while IFS= read -r -d '' f; do
            rel="${f#tests/isolated/}"
            mkdir -p "junit/isolated/$(dirname "$rel")"
            python tests/utils/pytest_wrapper.py "$f" --verbose \
              --junitxml "junit/isolated/${rel%.py}.xml" || fail=1
          done < <(find tests/isolated/ -name '*.py' -print0)
          exit $fail
      - name: Upload pytest results
        # junit reports feed the python section of the authoritative CI
        # comment (.github/scripts/python-section.mjs)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python }}
          path: junit/
          if-no-files-found: ignore
          retention-days: 3
