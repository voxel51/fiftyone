name: Lint App

on: workflow_call

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            changes:
              - 'app/**'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Prepare yarn
        uses: ./.github/actions/setup-yarn

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v6
        with:
          path: |
            app/node_modules
            app/.yarn/cache
          key: node-modules-${{ hashFiles('app/yarn.lock') }}

      - name: Install Dependencies
        run: cd app && yarn install

      # Guards against the Python default color pool drifting from the design
      # system. Reads the palette out of the installed @voxel51/voodo, so it
      # needs node_modules — hence living in this job rather than a workflow
      # that would install them a second time.
      - name: Check color palette is synced with @voxel51/voodo
        run: python3 tools/sync_voodoo_palette.py --check --skip-if-missing

      - parallel:
          - name: Lint ESLint packages
            run: |
              cd app
              ESLINT_PACKAGES=$(grep -v '^#' ./eslint-packages.txt | xargs)
              yarn eslint $ESLINT_PACKAGES

          - name: Check formatting
            run: |
              cd app
              yarn format:check

          - name: Check strict packages (multimodal, embeddings-v2)
            run: |
              cd app
              yarn check
