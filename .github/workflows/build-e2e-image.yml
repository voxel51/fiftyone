name: Build e2e image

on:
  push:
    branches:
      - develop
    paths:
      - requirements/**
      - setup.py
      - e2e-pw/yarn.lock
      - e2e-pw/ci/Dockerfile
      - .github/workflows/build-e2e-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Build and push e2e image
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e-pw/ci/Dockerfile
          push: true
          tags: |
            ghcr.io/voxel51/fiftyone-e2e:latest
            ghcr.io/voxel51/fiftyone-e2e:${{ github.sha }}
