name: Version Guard

# Fails a PR that changes the package VERSION outside the release flow. This is
# the deterministic replacement for routing VERSION through a human reviewer:
# the version number is owned by the release process, not ad-hoc PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Guard VERSION
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only the root VERSION file is guarded. package/db/setup.py
          # (fiftyone-db) is versioned independently of the release.
          changed=$(git diff "$BASE_SHA...$HEAD_SHA" -- VERSION || true)
          if [ -z "$changed" ]; then
            echo "No root VERSION change. OK."
            exit 0
          fi

          got=$(tr -d '\r\n' < VERSION)

          # On a release branch the VERSION must MATCH the branch name:
          # release/v<X> -> <X>, exactly.
          if [[ "$BASE_REF" == release/v* ]]; then
            want="${BASE_REF#release/v}"
            if [ "$got" = "$want" ]; then
              echo "VERSION $got matches release branch release/v$want. OK."
              exit 0
            fi
            echo "::error::VERSION ($got) does not match release branch release/v$want."
            echo "On a release branch the package version must match the branch name."
            exit 1
          fi

          # Off release branches, only a deliberate bump may change VERSION:
          # voxel51-bot automation, or a PR labeled 'version-bump'.
          if [ "$AUTHOR" = "voxel51-bot" ] || echo "$LABELS" | grep -q '"version-bump"'; then
            echo "Release-flow PR; VERSION change to $got allowed."
            exit 0
          fi

          echo "::error::This PR changes VERSION ($got) outside the release flow:"
          echo "$changed"
          echo "Bump it on a release/v* branch (where it must match the branch name), or add"
          echo "the 'version-bump' label if this is intentional."
          exit 1
