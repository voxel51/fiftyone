name: Pull Request

on:
  pull_request:
    # No `edited`: pr-retarget.yml turns a base change into a `synchronize`.
    # No `closed`: nothing here runs on it, and its no-op run races the suite
    # still testing the just-merged SHA, leaving a spurious red X on the merged
    # PR.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  # job containers pull the prebaked CI images (private in fiftyone-teams)
  packages: read

jobs:
  modified-files:
    runs-on: ubuntu-latest
    outputs:
      app-changes: ${{ steps.filter.outputs.app }}
      e2e-changes: ${{ steps.filter.outputs.e2e-pw }}
      fiftyone-changes: ${{ steps.filter.outputs.fiftyone }}
      format-changes: ${{ steps.filter.outputs.format }}
      python-changes: ${{ steps.filter.outputs.python }}
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/build.yml'
            e2e-pw:
              - 'e2e-pw/**'
              - '.github/scripts/**'
              - '.github/workflows/e2e.yml'
            fiftyone:
              - 'fiftyone/**'
              - 'package/**'
              - 'requirements/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'setup.py'
              - '.github/workflows/build.yml'
              - '.github/workflows/test.yml'
              - 'plugins/**'
            format:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.json'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.md'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - '.pre-commit-config.yaml'

      - name: Gate CI by base branch
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          # Heavy jobs (build/test/e2e/windows) only for PRs targeting a
          # long-lived branch. Intra-stack PRs (base = another feature branch)
          # skip them and are tested when promoted to main/release.
          heavy=false
          case "$BASE_REF" in
            main|release/*|community) heavy=true ;;
          esac
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  build:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/build.yml

  e2e:
    needs: modified-files
    # Drafts skip the e2e suite (mirroring enterprise-sync); it runs when
    # the PR is marked ready for review. all-tests treats skipped as green.
    if: >-
      needs.modified-files.outputs.heavy == 'true' &&
      github.event.pull_request.draft != true && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.e2e-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      checks: read
      # the comment's sibling-suite table reads the run's jobs; public repos
      # allow this implicitly but private fiftyone-teams requires the grant
      actions: read
      # job containers pull the prebaked CI images (private in fiftyone-teams)
      packages: read
      # the e2e verdict job upserts the authoritative CI results comment
      pull-requests: write

  lint:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true' ||
      needs.modified-files.outputs.format-changes == 'true'
    uses: ./.github/workflows/lint-app.yml

  lint-python:
    needs: modified-files
    if: needs.modified-files.outputs.python-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check black formatting
        # pre-commit installs the black pinned in .pre-commit-config.yaml, so
        # this check and the local hook agree on the version
        run: |
          pip install pre-commit
          pre-commit run black --all-files --show-diff-on-failure

  test:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/test.yml
    with:
      python-versions: >-
        ${{ (github.base_ref == 'main' ||
        startsWith(github.base_ref, 'feat/'))
        && '["3.10", "3.13"]' || '["3.10", "3.11", "3.12", "3.13"]' }}

  test-windows:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' &&
      needs.modified-files.outputs.fiftyone-changes == 'true'
    uses: ./.github/workflows/windows-test.yml
    with:
      python-versions: >-
        ${{ (github.base_ref == 'main' ||
        startsWith(github.base_ref, 'feat/'))
        && '["3.10", "3.13"]' || '["3.10", "3.11", "3.12", "3.13"]' }}

  ci-comment:
    # Every PR gets an authoritative CI comment. When the e2e pipeline ran,
    # it posted the comment — this job re-renders its sibling-suite rows
    # once every suite has concluded (suites that outlast e2e, like
    # test-windows, would freeze at ⏳) and settles the python section. When
    # e2e was skipped (drafts, docs-only changes, stacked PRs), this job
    # creates a suites-only comment instead; the e2e pipeline upgrades it in
    # place if it runs later.
    runs-on: ubuntu-latest
    needs: [modified-files, build, lint, lint-python, test, test-windows, e2e]
    if: >-
      always() &&
      needs.modified-files.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # reads the run's jobs; implicit on public repos, required on private
      # fiftyone-teams
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download pytest results
        # junit reports for the comment's python section; empty when the
        # python matrix was skipped or died before uploading
        run: |
          mkdir -p pytest-junit
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("pytest-results-")) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$name.zip"
            # -o: reruns list every attempt's artifact under the same name;
            # an interactive replace prompt would fail the job
            unzip -o -q -d "pytest-junit/$name" "$name.zip"
            printf '%s\t%s\n' "$name" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$id" \
              >> pytest-junit/artifact-urls.tsv
          done
      - name: Refresh suite rows on the CI comment
        run: |
          case "$GITHUB_REPOSITORY" in
            */fiftyone-teams) FLAVOR=FOE ;;
            *) FLAVOR=OSS ;;
          esac
          CID=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"ci-report:$FLAVOR\")) | .id" \
            | head -1)
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > run-jobs.json
          if [ -z "$CID" ]; then
            # e2e never posted one (skipped pipeline); every PR still gets a
            # suites-only comment
            node .github/scripts/refresh-suite-rows.mjs run-jobs.json --new pytest-junit > new-body.md
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@new-body.md
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CID" --jq .body > body.md
          node .github/scripts/refresh-suite-rows.mjs run-jobs.json body.md pytest-junit > new-body.md
          if cmp -s body.md new-body.md; then
            echo "suite rows already final"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" \
            -F body=@new-body.md

  all-tests:
    runs-on: ubuntu-latest
    needs: [modified-files, build, lint, lint-python, test, e2e]
    # not `always()`: a run displaced by a newer push must conclude
    # cancelled, not turn the failed gate into a red `all-tests` on a SHA it
    # never tested.
    if: ${{ !cancelled() }}
    steps:
      - name: Fail when the CI gate did not complete
        if: needs.modified-files.result != 'success'
        run: exit 1
      - name: Fail when a draft deferred the e2e suite
        # A draft run must not publish a successful merge-authoritative
        # aggregate for a SHA whose e2e never ran; it goes green after
        # ready_for_review.
        if: >-
          github.event.pull_request.draft == true &&
          needs.e2e.result == 'skipped' &&
          needs.modified-files.outputs.heavy == 'true' && (
          needs.modified-files.outputs.app-changes == 'true' ||
          needs.modified-files.outputs.e2e-changes == 'true' ||
          needs.modified-files.outputs.fiftyone-changes == 'true')
        run: |
          echo "draft PR — e2e deferred until ready_for_review"
          exit 1
      - name: Aggregate suite results
        run: sh -c ${{
          (needs.build.result == 'success' || needs.build.result == 'skipped') &&
          (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
          (needs.lint-python.result == 'success' || needs.lint-python.result == 'skipped') &&
          (needs.test.result == 'success' || needs.test.result == 'skipped') &&
          (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
