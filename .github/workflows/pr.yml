name: Pull Request

on:
  pull_request:
    # `edited` catches base changes — notably GitHub auto-retargeting a stacked
    # PR to develop when the PR below it merges — so the heavy suite runs before
    # it can land (no `synchronize` fires on an auto-retarget). No `closed`:
    # nothing here runs on it, and its no-op run races the suite still testing
    # the just-merged SHA, leaving a spurious red X on the merged PR.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  # A PR title/body edit is a no-op run (run-ci=false). It gets its own group:
  # `cancel-in-progress: false` can't protect a *queued* real run — GitHub
  # allows only one queued run per group — so a shared group lets an edit
  # displace the suite run before it starts.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    (github.event.action == 'edited' && github.event.changes.base == null)
    && 'noop' || 'ci' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  # job containers pull the prebaked CI images (private in fiftyone-teams)
  packages: read

jobs:
  modified-files:
    runs-on: ubuntu-latest
    outputs:
      app-changes: ${{ steps.filter.outputs.app }}
      e2e-changes: ${{ steps.filter.outputs.e2e-pw }}
      fiftyone-changes: ${{ steps.filter.outputs.fiftyone }}
      format-changes: ${{ steps.filter.outputs.format }}
      run-ci: ${{ steps.gate.outputs.run-ci }}
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/build.yml'
            e2e-pw:
              - 'e2e-pw/**'
              - '.github/scripts/**'
              - '.github/workflows/e2e.yml'
            fiftyone:
              - 'fiftyone/**'
              - 'package/**'
              - 'requirements/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'setup.py'
              - '.github/workflows/build.yml'
              - '.github/workflows/test.yml'
              - 'plugins/**'
            format:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.json'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.md'

      - name: Gate CI by base branch
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        shell: bash
        run: |
          # `edited` fires on title/body edits too; only (re)run when the base
          # changed (e.g. a stacked PR auto-retargeted to develop after the one
          # below merged).
          run_ci=true
          if [ "$ACTION" = "edited" ] && [ "$BASE_CHANGED" != "true" ]; then
            run_ci=false
          fi
          # Heavy jobs (build/test/e2e/windows) only for PRs targeting a
          # long-lived branch. Intra-stack PRs (base = another feature branch)
          # skip them and are tested when promoted to develop/release.
          heavy=false
          if [ "$run_ci" = "true" ]; then
            case "$BASE_REF" in
              develop|release/*|community) heavy=true ;;
            esac
          fi
          echo "run-ci=$run_ci" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  build:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/build.yml

  e2e:
    needs: modified-files
    # Drafts skip the e2e suite (mirroring enterprise-sync); it runs when
    # the PR is marked ready for review. all-tests treats skipped as green.
    if: >-
      needs.modified-files.outputs.heavy == 'true' &&
      github.event.pull_request.draft != true && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.e2e-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      checks: read
      # the comment's sibling-suite table reads the run's jobs; public repos
      # allow this implicitly but private fiftyone-teams requires the grant
      actions: read
      # job containers pull the prebaked CI images (private in fiftyone-teams)
      packages: read
      # the e2e verdict job upserts the authoritative CI results comment
      pull-requests: write

  lint:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.run-ci == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true' ||
      needs.modified-files.outputs.format-changes == 'true')
    uses: ./.github/workflows/lint-app.yml

  test:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/test.yml
    with:
      python-versions: >-
        ${{ (github.base_ref == 'develop' ||
        startsWith(github.base_ref, 'feat/'))
        && '["3.10", "3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]' }}

  test-windows:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' &&
      needs.modified-files.outputs.fiftyone-changes == 'true'
    uses: ./.github/workflows/windows-test.yml
    with:
      python-versions: >-
        ${{ (github.base_ref == 'develop' ||
        startsWith(github.base_ref, 'feat/'))
        && '["3.10", "3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]' }}

  ci-comment:
    # Every PR gets an authoritative CI comment. When the e2e pipeline ran,
    # it posted the comment — this job re-renders its sibling-suite rows
    # once every suite has concluded (suites that outlast e2e, like
    # test-windows, would freeze at ⏳) and settles the python section. When
    # e2e was skipped (drafts, docs-only changes, stacked PRs), this job
    # creates a suites-only comment instead; the e2e pipeline upgrades it in
    # place if it runs later.
    runs-on: ubuntu-latest
    needs: [modified-files, build, lint, test, test-windows, e2e]
    if: >-
      always() &&
      needs.modified-files.outputs.run-ci == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # reads the run's jobs; implicit on public repos, required on private
      # fiftyone-teams
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download pytest results
        # junit reports for the comment's python section; empty when the
        # python matrix was skipped or died before uploading
        run: |
          mkdir -p pytest-junit
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("pytest-results-")) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$name.zip"
            # -o: reruns list every attempt's artifact under the same name;
            # an interactive replace prompt would fail the job
            unzip -o -q -d "pytest-junit/$name" "$name.zip"
            printf '%s\t%s\n' "$name" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$id" \
              >> pytest-junit/artifact-urls.tsv
          done
      - name: Refresh suite rows on the CI comment
        run: |
          case "$GITHUB_REPOSITORY" in
            */fiftyone-teams) FLAVOR=FOE ;;
            *) FLAVOR=OSS ;;
          esac
          CID=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"ci-report:$FLAVOR\")) | .id" \
            | head -1)
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > run-jobs.json
          if [ -z "$CID" ]; then
            # e2e never posted one (skipped pipeline); every PR still gets a
            # suites-only comment
            node .github/scripts/refresh-suite-rows.mjs run-jobs.json --new pytest-junit > new-body.md
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@new-body.md
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CID" --jq .body > body.md
          node .github/scripts/refresh-suite-rows.mjs run-jobs.json body.md pytest-junit > new-body.md
          if cmp -s body.md new-body.md; then
            echo "suite rows already final"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" \
            -F body=@new-body.md

  all-tests:
    # A no-op run (title/body edit, run-ci=false) publishes its aggregate
    # under an alias. Branch protection and the PR UI read only the latest
    # check run per name — and skipped counts as passing — so a no-op run's
    # `all-tests` would shadow the real verdict (vacuous green on a SHA whose
    # suite failed, or a misleading link on one that passed). Under the alias,
    # the SHA's latest `all-tests` is always the run that actually tested it.
    name: >-
      ${{ (needs.modified-files.result == 'success' &&
      needs.modified-files.outputs.run-ci != 'true')
      && 'all-tests (no-op edit)' || 'all-tests' }}
    runs-on: ubuntu-latest
    needs: [modified-files, build, lint, test, e2e]
    # not `always()`: a concurrency-cancelled run (an edit displaced by the
    # next edit) must conclude cancelled, not turn the failed gate into a
    # red `all-tests` on a SHA it never tested.
    if: ${{ !cancelled() }}
    env:
      # skips the draft and aggregate steps — a no-op run tested nothing,
      # so it has nothing to aggregate under its alias
      NO_OP: >-
        ${{ needs.modified-files.result == 'success' &&
        needs.modified-files.outputs.run-ci != 'true' }}
    steps:
      - name: Fail when the CI gate did not complete
        if: needs.modified-files.result != 'success'
        run: exit 1
      - name: Point at the run testing this SHA
        if: env.NO_OP == 'true'
        run: >-
          echo "Title/body edit — no code ran here. The verdict is the
          \`all-tests\` check from the run that tested this SHA."
      - name: Fail when a draft deferred the e2e suite
        # A draft run must not publish a successful merge-authoritative
        # aggregate for a SHA whose e2e never ran; it goes green after
        # ready_for_review.
        if: >-
          env.NO_OP != 'true' &&
          github.event.pull_request.draft == true &&
          needs.e2e.result == 'skipped' &&
          needs.modified-files.outputs.heavy == 'true' && (
          needs.modified-files.outputs.app-changes == 'true' ||
          needs.modified-files.outputs.e2e-changes == 'true' ||
          needs.modified-files.outputs.fiftyone-changes == 'true')
        run: |
          echo "draft PR — e2e deferred until ready_for_review"
          exit 1
      - name: Aggregate suite results
        if: env.NO_OP != 'true'
        run: sh -c ${{
          (needs.build.result == 'success' || needs.build.result == 'skipped') &&
          (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
          (needs.test.result == 'success' || needs.test.result == 'skipped') &&
          (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
