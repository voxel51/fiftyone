name: Pull Request

on:
  pull_request:
    # `edited` catches base changes — notably GitHub auto-retargeting a stacked
    # PR to develop when the PR below it merges — so the heavy suite runs before
    # it can land (no `synchronize` fires on an auto-retarget). No `closed`:
    # nothing here runs on it, and its no-op run races the suite still testing
    # the just-merged SHA, leaving a spurious red X on the merged PR.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  # A PR title/body edit is a no-op run (run-ci=false). It gets its own group:
  # `cancel-in-progress: false` can't protect a *queued* real run — GitHub
  # allows only one queued run per group — so a shared group lets an edit
  # displace the suite run before it starts.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    (github.event.action == 'edited' && github.event.changes.base == null)
    && 'noop' || 'ci' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  # job containers pull the prebaked CI images (private in fiftyone-teams)
  packages: read

jobs:
  modified-files:
    runs-on: ubuntu-latest
    outputs:
      app-changes: ${{ steps.filter.outputs.app }}
      e2e-changes: ${{ steps.filter.outputs.e2e-pw }}
      fiftyone-changes: ${{ steps.filter.outputs.fiftyone }}
      format-changes: ${{ steps.filter.outputs.format }}
      run-ci: ${{ steps.gate.outputs.run-ci }}
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/docs/**
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/build.yml'
            e2e-pw:
              - 'e2e-pw/**'
              - '.github/workflows/e2e.yml'
            fiftyone:
              - 'fiftyone/**'
              - 'package/**'
              - 'requirements/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'setup.py'
              - '.github/workflows/build.yml'
              - '.github/workflows/test.yml'
              - 'plugins/**'
            format:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.json'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.md'

      - name: Gate CI by base branch
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        shell: bash
        run: |
          # `edited` fires on title/body edits too; only (re)run when the base
          # changed (e.g. a stacked PR auto-retargeted to develop after the one
          # below merged).
          run_ci=true
          if [ "$ACTION" = "edited" ] && [ "$BASE_CHANGED" != "true" ]; then
            run_ci=false
          fi
          # Heavy jobs (build/test/e2e/windows) only for PRs targeting a
          # long-lived branch. Intra-stack PRs (base = another feature branch)
          # skip them and are tested when promoted to develop/release.
          heavy=false
          if [ "$run_ci" = "true" ]; then
            case "$BASE_REF" in
              develop|main|release/*) heavy=true ;;
            esac
          fi
          echo "run-ci=$run_ci" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  build:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/build.yml

  e2e:
    needs: modified-files
    # Drafts skip the e2e suite (mirroring enterprise-sync); it runs when
    # the PR is marked ready for review. all-tests treats skipped as green.
    if: >-
      needs.modified-files.outputs.heavy == 'true' &&
      github.event.pull_request.draft != true && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.e2e-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      checks: read
      # the comment's sibling-suite table reads the run's jobs; public repos
      # allow this implicitly but private fiftyone-teams requires the grant
      actions: read
      # job containers pull the prebaked CI images (private in fiftyone-teams)
      packages: read
      # the e2e verdict job upserts the authoritative e2e results comment
      pull-requests: write

  lint:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.run-ci == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true' ||
      needs.modified-files.outputs.format-changes == 'true')
    uses: ./.github/workflows/lint-app.yml

  test:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' && (
      needs.modified-files.outputs.app-changes == 'true' ||
      needs.modified-files.outputs.fiftyone-changes == 'true')
    uses: ./.github/workflows/test.yml
    with:
      python-versions: >-
        ${{ (github.base_ref == 'develop' ||
        startsWith(github.base_ref, 'feat/'))
        && '["3.10", "3.12"]' || '["3.10", "3.11", "3.12"]' }}

  test-windows:
    needs: modified-files
    if: >-
      needs.modified-files.outputs.heavy == 'true' &&
      needs.modified-files.outputs.fiftyone-changes == 'true'
    uses: ./.github/workflows/windows-test.yml
    with:
      python-versions: >-
        ${{ (github.base_ref == 'develop' ||
        startsWith(github.base_ref, 'feat/'))
        && '["3.10", "3.12"]' || '["3.10", "3.11", "3.12"]' }}

  e2e-comment-suites:
    # The authoritative e2e comment freezes its sibling-suite rows when the
    # e2e verdict posts it, so suites that outlast e2e (test-windows) show ⏳
    # forever; re-render the rows once every suite has concluded.
    runs-on: ubuntu-latest
    needs: [modified-files, build, lint, test, test-windows, e2e]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["success", "failure"]'), needs.e2e.result)
    permissions:
      contents: read
      # reads the run's jobs; implicit on public repos, required on private
      # fiftyone-teams
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: e2e-pw/scripts
      - name: Refresh suite rows on the e2e comment
        run: |
          case "$GITHUB_REPOSITORY" in
            */fiftyone-teams) FLAVOR=FOE ;;
            *) FLAVOR=OSS ;;
          esac
          CID=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"e2e-authoritative-report:$FLAVOR\")) | .id" \
            | head -1)
          if [ -z "$CID" ]; then
            echo "no authoritative e2e comment to refresh"
            exit 0
          fi
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > run-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CID" --jq .body > body.md
          node e2e-pw/scripts/refresh-suite-rows.mjs run-jobs.json body.md > new-body.md
          if cmp -s body.md new-body.md; then
            echo "suite rows already final"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" \
            -F body=@new-body.md

  all-tests:
    runs-on: ubuntu-latest
    needs: [modified-files, build, lint, test, e2e]
    if: always()
    env:
      # A run that skipped the suite (a no-op body edit, or a failed gate)
      # must not aggregate its skipped needs into a vacuous green that
      # becomes the latest `all-tests` for a SHA whose real suite failed.
      NO_OP: >-
        ${{ needs.modified-files.result == 'success' &&
        needs.modified-files.outputs.run-ci != 'true' }}
    steps:
      - name: Fail when the CI gate did not complete
        if: needs.modified-files.result != 'success'
        run: exit 1
      - name: Mirror the last real all-tests result
        if: env.NO_OP == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // A no-op edit usually lands while the run actually testing this
            // SHA is still in flight (this job's own check run is in_progress,
            // so it never matches the completed filter). Poll for that run's
            // verdict rather than failing on the gap — a vacuous green here
            // could merge the PR before its suite finishes.
            const deadline = Date.now() + 45 * 60 * 1000;
            for (;;) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
                check_name: 'all-tests',
                // `latest` (the default) returns only the newest run per name —
                // this job's own in_progress run — hiding the completed verdict.
                filter: 'all',
                per_page: 100,
              });
              // Never mirror while another suite run is in flight — a
              // stale completed green (e.g. a draft-era run whose e2e was
              // skipped) must not shadow the run actually testing this SHA.
              const isSelf = (c) =>
                (c.details_url ?? '').includes(`/runs/${context.runId}/`);
              const inFlight = data.check_runs.some(
                (c) => c.status !== 'completed' && !isSelf(c),
              );
              const prior = data.check_runs
                .filter((c) => c.status === 'completed')
                .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];
              // A rerun of failed jobs leaves the prior attempt's check run
              // completed while its workflow run is live again; the next
              // attempt's check run doesn't exist until its needs finish.
              // Any non-completed sibling check run from the same workflow
              // run reveals the rerun.
              let rerunning = false;
              if (prior && !inFlight) {
                const runPath = (prior.details_url ?? '').match(/\/runs\/\d+\//)?.[0];
                if (runPath) {
                  const siblings = await github.paginate(github.rest.checks.listForRef, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: context.payload.pull_request.head.sha,
                    filter: 'all',
                    per_page: 100,
                  });
                  rerunning = siblings.some(
                    (c) =>
                      c.status !== 'completed' &&
                      !isSelf(c) &&
                      (c.details_url ?? '').includes(runPath),
                  );
                }
              }
              if (prior && !inFlight && !rerunning) {
                if (prior.conclusion === 'success') {
                  core.info('Mirroring the previous all-tests result: success');
                } else {
                  core.setFailed(`Mirroring the previous all-tests result: ${prior.conclusion}`);
                }
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed('No completed all-tests for this commit after 45 minutes — deferring to the run testing it.');
                return;
              }
              core.info('No completed all-tests for this commit yet — waiting for the run testing it.');
              await new Promise((resolve) => setTimeout(resolve, 30 * 1000));
            }
      - name: Fail when a draft deferred the e2e suite
        # A draft run must not publish a successful merge-authoritative
        # aggregate for a SHA whose e2e never ran; it goes green after
        # ready_for_review.
        if: >-
          env.NO_OP != 'true' &&
          github.event.pull_request.draft == true &&
          needs.e2e.result == 'skipped' &&
          needs.modified-files.outputs.heavy == 'true' && (
          needs.modified-files.outputs.app-changes == 'true' ||
          needs.modified-files.outputs.e2e-changes == 'true' ||
          needs.modified-files.outputs.fiftyone-changes == 'true')
        run: |
          echo "draft PR — e2e deferred until ready_for_review"
          exit 1
      - name: Aggregate suite results
        if: env.NO_OP != 'true'
        run: sh -c ${{
          (needs.build.result == 'success' || needs.build.result == 'skipped') &&
          (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
          (needs.test.result == 'success' || needs.test.result == 'skipped') &&
          (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
