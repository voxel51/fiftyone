name: "Setup FFmpeg"
description: >-
  Install ffmpeg on Windows runners via Chocolatey. Linux test and e2e jobs
  run in prebaked containers (see build-ci-images.yml) that already include
  ffmpeg, so this action has no Linux branch.

runs:
  using: "composite"
  steps:
    - name: Install ffmpeg (Windows)
      shell: pwsh
      run: |
        choco install ffmpeg -y --no-progress --execution-timeout=600
        # ensure the choco shim dir is on PATH for this and subsequent steps
        "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
        ffmpeg -version
